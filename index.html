<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>蓝调勘景仪</title>
<meta name="description" content="蓝调时刻拍摄勘景工具：地平线遮挡剖面、分钟级光线时间轴、云量决策">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07070a">
<meta name="color-scheme" content="dark">

<!-- iOS 添加到主屏幕 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="蓝调勘景">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<!-- 主题必须在首次绘制之前定下来，否则每次打开都会先闪一下夜间再跳成日间。
     所以这里在样式表之前、用同步的 localStorage 读偏好（IndexedDB 是异步的，赶不上）。 -->
<script>
(function () {
  try {
    var t = localStorage.getItem('bh-theme');
    if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); }
  } catch (e) { /* 读不到（无痕模式等）就用默认的夜间 */ }
}());
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">
  <header class="topbar" id="topbar"></header>
  <main class="view" id="view"></main>
  <nav class="dock" id="dock" style="display:none"></nav>
</div>

<!-- 核心：纯计算，无 DOM 依赖 -->
<script src="js/core/solar.js"></script>
<script src="js/core/tz.js"></script>
<script src="js/core/horizon.js"></script>
<script src="js/core/exposure.js"></script>
<script src="js/core/timeline.js"></script>
<script src="js/core/cloud.js"></script>
<!-- 数据层 -->
<script src="js/data/db.js"></script>
<script src="js/data/records.js"></script>
<script src="js/data/settings.js"></script>
<script src="js/data/calibration.js"></script>
<script src="js/data/weather.js"></script>
<!-- 界面层 -->
<script src="js/ui/theme.js"></script>
<script src="js/ui/app.js"></script>
<script src="js/ui/compass.js"></script>
<script src="js/ui/viewfinder.js"></script>
<script src="js/ui/horizon-ui.js"></script>
<script src="js/ui/scout.js"></script>
<script src="js/ui/timeline-ui.js"></script>
<script src="js/ui/settings-ui.js"></script>
<script src="js/ui/weather-ui.js"></script>
<!-- 开发用：只在网址带 ?sim=1 时启用 -->
<script src="js/ui/compass-sim.js"></script>

<script>
(function () {
  'use strict';

  // 启动阶段出任何错都要显示出来。黑屏最难排查，尤其在现场。
  function showBootError(what) {
    var v = document.getElementById('view');
    if (!v || v.querySelector('.boot-error')) { return; }
    var d = document.createElement('div');
    d.className = 'note bad boot-error';
    d.textContent = '出错了：' + what;
    v.insertBefore(d, v.firstChild);
  }
  window.addEventListener('error', function (e) {
    showBootError(e.message || String(e.error) || '未知错误');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    showBootError((r && r.message) ? r.message : String(r));
  });

  var A = BH.App;

  // 浏览器外壳（地址栏、Android 状态栏）的颜色跟当前主题对齐
  BH.Theme.syncMeta();

  A.route('/', BH.Scout.renderList);
  A.route('/rec/:id', BH.Scout.renderOverview);
  A.route('/rec/:id/s/:step', BH.Scout.renderStep);
  A.route('/rec/:id/horizon', BH.Scout.renderHorizon);
  A.route('/rec/:id/timeline', BH.TimelineUI.render);
  A.route('/rec/:id/weather', BH.WeatherUI.render);
  A.route('/settings', BH.SettingsUI.render);

  A.start({
    topbar: document.getElementById('topbar'),
    view: document.getElementById('view'),
    dock: document.getElementById('dock')
  });

  // 电脑上没有磁力计，?sim=1 时用模拟器验采样交互
  BH.CompassSim.activate();

  // 存储不可用时要明说，不能让用户以为存进去了
  BH.DB.probe().then(function (res) {
    if (res.ok) { return; }
    var v = document.getElementById('view');
    v.insertBefore(A.h('div', { class: 'note bad' }, [
      A.h('b', { text: '本机存储不可用：' }), res.error,
      A.h('br'),
      '如果在 Safari 的无痕模式下，请换成普通窗口。记录暂时无法保存。'
    ]), v.firstChild);
  });

  // Service Worker：断网时除天气外全部功能可用。
  // 缓存策略是网络优先（见 sw.js），所以有网时打开一定是最新代码。
  // 这里再做两件事：一是每次打开都主动检查 sw.js 有没有更新，
  // 二是新版本装好后弹提示——注意 register() 返回时新版本可能**已经**装完，
  // 那时 updatefound 事件早就过去了，只监听事件会漏掉，所以还要查一遍
  // reg.waiting / reg.installing。
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading) { return; }
        reloading = true;
        location.reload();
      });

      navigator.serviceWorker.register('sw.js', {
        // sw.js 本身绝不走 HTTP 缓存，否则更新检查会被缓存挡住
        updateViaCache: 'none'
      }).then(function (reg) {
        function watch(sw) {
          if (!sw) { return; }
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBar(sw);
            return;
          }
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBar(sw);
            }
          });
        }

        // register() 之前就装好的情况
        watch(reg.waiting);
        watch(reg.installing);
        reg.addEventListener('updatefound', function () { watch(reg.installing); });

        // 每次打开、以及从后台切回来时，主动查一次有没有新版本
        function check() { reg.update().catch(function () {}); }
        check();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') { check(); }
        });
      }).catch(function () {
        // 注册失败不影响在线使用，静默即可
      });
    });
  }

  function showUpdateBar(sw) {
    if (document.getElementById('update-bar')) { return; }
    var bar = A.h('div', { id: 'update-bar', class: 'update-bar' }, [
      A.h('span', { class: 'txt', text: '有新版本' }),
      A.h('button', {
        class: 'btn sm ghost', type: 'button',
        on: { click: function () { bar.remove(); } }
      }, '稍后'),
      A.h('button', {
        class: 'btn sm primary', type: 'button',
        on: { click: function () { sw.postMessage('skipWaiting'); } }
      }, '刷新')
    ]);
    document.body.appendChild(bar);
  }
}());
</script>
</body>
</html>
